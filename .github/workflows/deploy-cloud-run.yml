name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: proysocial-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  DB_NAME: ${{ vars.DB_NAME }}
  DB_USER: ${{ vars.DB_USER }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  GOOGLE_DOMAIN: ${{ vars.GOOGLE_DOMAIN }}
  DB_PASSWORD_SECRET: ${{ vars.DB_PASSWORD_SECRET || 'proysocial-db-password' }}
  JWT_SECRET_NAME: ${{ vars.JWT_SECRET_NAME || 'proysocial-jwt-secret' }}
  SMTP_HOST: ${{ vars.SMTP_HOST }}
  SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
  SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
  SMTP_USER: ${{ vars.SMTP_USER }}
  SMTP_FROM: ${{ vars.SMTP_FROM }}
  SMTP_PASS_SECRET: ${{ vars.SMTP_PASS_SECRET || 'proysocial-smtp-password' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate with the single service account
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Validate deployment variables
        shell: bash
        run: |
          required=(GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY CLOUD_RUN_SERVICE CLOUD_SQL_INSTANCE GCP_SERVICE_ACCOUNT DB_NAME DB_USER GOOGLE_CLIENT_ID)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the application image
        shell: bash
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/proysocial:${GITHUB_SHA}"
          docker build \
            --build-arg VITE_API_URL= \
            --build-arg VITE_GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
            --tag "${IMAGE_URI}" \
            .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Deploy migration job
        shell: bash
        run: |
          gcloud run jobs deploy "${CLOUD_RUN_SERVICE}-migrate" \
            --image "${IMAGE_URI}" \
            --region "${GCP_REGION}" \
            --service-account "${GCP_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --set-env-vars "NODE_ENV=production,INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE},PGDATABASE=${DB_NAME},PGUSER=${DB_USER}" \
            --set-secrets "PGPASSWORD=${DB_PASSWORD_SECRET}:latest" \
            --command node \
            --args backend/scripts/migrate.js \
            --max-retries 1 \
            --task-timeout 20m \
            --quiet

      - name: Run database migrations
        run: gcloud run jobs execute "${CLOUD_RUN_SERVICE}-migrate" --region "${GCP_REGION}" --wait

      - name: Bootstrap the first administrator
        if: ${{ vars.ADMIN_EMAIL != '' }}
        shell: bash
        run: |
          gcloud run jobs deploy "${CLOUD_RUN_SERVICE}-bootstrap-admin" \
            --image "${IMAGE_URI}" \
            --region "${GCP_REGION}" \
            --service-account "${GCP_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --set-env-vars "NODE_ENV=production,INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE},PGDATABASE=${DB_NAME},PGUSER=${DB_USER},ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }},ADMIN_NOMBRE=${{ vars.ADMIN_NOMBRE }},ADMIN_APELLIDO=${{ vars.ADMIN_APELLIDO }}" \
            --set-secrets "PGPASSWORD=${DB_PASSWORD_SECRET}:latest" \
            --command node \
            --args backend/scripts/bootstrap-admin.js \
            --max-retries 0 \
            --task-timeout 5m \
            --quiet
          gcloud run jobs execute "${CLOUD_RUN_SERVICE}-bootstrap-admin" --region "${GCP_REGION}" --wait

      - name: Deploy application
        shell: bash
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE_URI}" \
            --region "${GCP_REGION}" \
            --service-account "${GCP_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --set-env-vars "NODE_ENV=production,INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE},PGDATABASE=${DB_NAME},PGUSER=${DB_USER},GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID},ALLOWED_GOOGLE_DOMAINS=${GOOGLE_DOMAIN},SESSION_TTL=8h" \
            --set-secrets "PGPASSWORD=${DB_PASSWORD_SECRET}:latest,JWT_SECRET=${JWT_SECRET_NAME}:latest" \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 10 \
            --allow-unauthenticated \
            --quiet

      - name: Configure notification email
        shell: bash
        run: |
          required=(SMTP_HOST SMTP_PORT SMTP_USER SMTP_FROM SMTP_PASS_SECRET)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing email variable: ${name}" >&2
              exit 1
            fi
          done

          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --region "${GCP_REGION}" --format='value(status.url)')"
          gcloud run services update "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" \
            --update-env-vars "SMTP_HOST=${SMTP_HOST},SMTP_PORT=${SMTP_PORT},SMTP_SECURE=${SMTP_SECURE},SMTP_USER=${SMTP_USER},SMTP_FROM=${SMTP_FROM},APP_PUBLIC_URL=${SERVICE_URL}" \
            --update-secrets "SMTP_PASS=${SMTP_PASS_SECRET}:latest" \
            --quiet

      - name: Verify deployment
        shell: bash
        run: |
          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --region "${GCP_REGION}" --format='value(status.url)')"
          curl --fail --show-error --silent --retry 6 --retry-delay 5 "${SERVICE_URL}/health"
          echo "Deployed: ${SERVICE_URL}"
